[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Local-first autonomous file watcher for Obsidian vaults"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=6.0",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gmail-sentinel = "sentinels.gmail_watcher:main"
brain = "orchestrator.brain:main"
route-inbox = "router.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
