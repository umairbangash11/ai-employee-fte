[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Local-first autonomous file watcher for Obsidian vaults"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    "python-frontmatter>=1.0",
    "pydantic>=2.0",
    "playwright>=1.40",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sentinel = "sentinel.__main__:main"
gmail-watcher = "gmail_watcher.__main__:main"
email-reasoner = "email_reasoner.__main__:main"
hitl-approval = "hitl_approval.__main__:cli"
linkedin-publish = "linkedin_publisher.__main__:cli"
facebook-publish = "facebook_publisher.__main__:cli"
whatsapp-watcher = "whatsapp_watcher.__main__:main"
odoo-mcp = "odoo_mcp.__main__:main"
odoo-executor = "odoo_accounting.executor:main"
instagram-executor = "instagram_publisher.__main__:cli"
x-executor = "x_publisher.__main__:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
